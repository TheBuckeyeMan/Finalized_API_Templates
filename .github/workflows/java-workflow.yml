#Template Workflow for Java API's
name: Java CI/CD Pipeline

on:
  push:
    branches:
      - master
      - UAT
      - deletenow #Add additional branches if we neeed to add additional branches

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: '21'

      - name: Build with Maven
        run: mvn compile dependency:copy-dependencies -DincludeScope=runtime
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Logging into Docker Hub...
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Building Docker Image... # Edit regions if you would like to deploy to different regions
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api:deleteapi .
          docker tag ${{ secrets.DOCKER_USERNAME }}/api:deleteapi ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/youtube-containers:deleteapi

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/api:deleteapi

      - name: Configuring AWS Credentials...
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region ${{ secrets.AWS_REGION }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Pushing Docker Image to ECR...
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/youtube-containers:deleteapi

      - name: Deploying Resources...
        env:
          CICD_GH_TOKEN: ${{ secrets.CICD_GH_TOKEN }}
        run: |
          repo_owner="TheBuckeyeMan"
          repo_name="Finalized_API_IAC"
          event_type="trigger-workflow"
          branch="delete"

          curl -H "Authorization: token ${{ secrets.CICD_GH_TOKEN }}" https://api.github.com/repos/TheBuckeyeMan/Finalized_API_IAC

          echo "Sending repository_dispatch to $repo_owner/$repo_name on branch $branch"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CICD_GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"branch\": \"$branch\"}}"